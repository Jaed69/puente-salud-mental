[project]
name = "puente-backend"
version = "0.1.0"
description = "Puente backend: support assistant API with a deterministic safety guardian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pypdf>=7.1.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.4",
    "fastembed>=0.9",
    "mcp>=2.3.0",
]

[project.scripts]
puente-knowledge = "puente.knowledge.cli:main"
puente-mcp = "puente.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["puente"]
